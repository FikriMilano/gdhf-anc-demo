# Builds the iOS app and uploads it to TestFlight. Start it from the Actions tab ("Run workflow").
# Runs on GitHub's macOS 26 image because App Store Connect only accepts builds made with Xcode 26+.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   ASC_KEY_ID      App Store Connect API key ID
#   ASC_ISSUER_ID   App Store Connect issuer ID
#   ASC_KEY_P8      contents of the downloaded AuthKey_XXXX.p8 file
#   APPLE_TEAM_ID   Apple Developer team ID
name: iOS to TestFlight

on: workflow_dispatch

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      # Rebuilds the PEM from the secret, whatever happened to its line breaks when it was pasted
      # (one line, CRLF, literal "\n"), then checks it is a valid key. Never prints the key.
      - name: API key file
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          body=$(printf '%s' "$ASC_KEY_P8" | sed -e 's/\\n/\n/g' -e 's/-----[A-Z ]*-----//g' | tr -d ' \t\r\n')
          { echo "-----BEGIN PRIVATE KEY-----"; echo "$body" | fold -w 64; echo "-----END PRIVATE KEY-----"; } \
            > "$RUNNER_TEMP/asc-key.p8"
          if ! openssl pkey -in "$RUNNER_TEMP/asc-key.p8" -noout 2>/dev/null; then
            echo "::error::ASC_KEY_P8 is not a valid private key (${#body} base64 characters after cleanup;"\
              "a .p8 key has about 184). Paste the whole AuthKey_XXXX.p8 file into the secret again."
            exit 1
          fi

      # The archive is built unsigned: signing it here would need a development profile, which
      # Apple only creates for a team with a registered device. The upload step below signs it for
      # distribution (cloud-managed certificate, App Store profile), which needs no device.
      # The build number is the run number, so every upload is new.
      - name: Archive
        run: |
          xcodebuild -version
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/anc.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/anc.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc-key.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
